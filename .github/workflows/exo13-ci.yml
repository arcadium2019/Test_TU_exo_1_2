name: Exo13 - Banking API CI

on:
  push:
    paths:
      - 'Exo13/**'
      - '.github/workflows/exo13-ci.yml'
  pull_request:
    paths:
      - 'Exo13/**'
      - '.github/workflows/exo13-ci.yml'

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Run tests and generate reports
        run: mvn -pl Exo13 -am test --no-transfer-progress

      - name: Upload Surefire reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: Exo13/target/surefire-reports

      - name: Upload JaCoCo report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: Exo13/target/site/jacoco

      - name: Upload Cucumber report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cucumber-reports
          path: |
            Exo13/target/cucumber-report.html
            Exo13/target/cucumber-report.json
